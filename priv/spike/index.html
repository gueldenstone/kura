<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f7a4c">
  <link rel="manifest" href="/spike/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/spike/icon-192.png">
  <title>Kura spike</title>
  <style>
    body { font: 18px system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 32rem; margin-inline: auto; }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem } h2 { font-size: 1rem; margin: 1.5rem 0 .25rem; color: #555 }
    ul { list-style: none; padding: 0; margin: 0 } li { padding: .6rem 0; border-bottom: 1px solid #eee }
    li.done label { text-decoration: line-through; color: #888 }
    input[type=checkbox] { width: 1.3rem; height: 1.3rem; margin-right: .6rem; vertical-align: middle }
    .qty { color: #888; float: right } #status { font-weight: 600 } .ok { color: #1f7a4c } .off { color: #b3261e }
    small { color: #777; display: block } button { font-size: 1rem; padding: .4rem .8rem; margin-right: .5rem }
  </style>
</head>
<body>
  <h1>Kura offline spike</h1>
  <div id="status">…</div>
  <small id="updated"></small><small id="sw"></small>
  <p><button id="sync">Sync now</button><button id="reset">Reset server data</button></p>
  <h2>Shopping list</h2>
  <ul id="shopping"></ul>
  <h2>Inventory</h2>
  <ul id="inventory"></ul>
  <script src="/spike/app.js"></script>
</body>
</html>
